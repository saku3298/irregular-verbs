<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不規則動詞クイズ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    background: #f7f6f2;
    color: #2c2c2a;
  }
  h1 { font-size: 20px; font-weight: 600; text-align: center; margin: 0 0 4px; }
  .subtitle { text-align: center; color: #5f5e5a; font-size: 14px; margin-bottom: 24px; }
  button {
    font-family: inherit;
    font-size: 15px;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #d3d1c7;
    background: white;
    color: #2c2c2a;
    cursor: pointer;
  }
  button:hover { background: #f1efe8; }
  button:active { transform: scale(0.98); }
  input[type=text] {
    font-family: inherit;
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #d3d1c7;
    width: 100%;
    text-align: center;
  }
  input[type=text]:focus { outline: 2px solid #378ADD; border-color: #378ADD; }
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 24px 16px;
    text-align: center;
    margin-bottom: 16px;
  }
  .setup-buttons { display: flex; flex-direction: column; gap: 10px; }
  .icon-btn {
    width: 38px; height: 38px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .row-flex { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .progress { display: flex; justify-content: space-between; font-size: 13px; color: #888780; margin-bottom: 12px; }
  .primary-btn { width: 100%; background: #2c2c2a; color: white; border: none; margin-top: 4px; }
  .primary-btn:hover { background: #444441; }
  .err { font-size: 13px; color: #c0392b; min-height: 18px; text-align: center; margin: 4px 0 8px; }
  .result-num { font-size: 34px; font-weight: 600; margin: 0 0 4px; text-align: center; }
  .result-pct { font-size: 14px; color: #5f5e5a; margin: 0 0 20px; text-align: center; }
  .wrong-box { text-align: left; background: white; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .wrong-box p { font-size: 14px; margin: 5px 0; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }
  .correct-text { color: #27500a; }
  .wrong-text { color: #791f1f; }

  .topnav { display:flex; gap:8px; margin:0 0 16px; }
  .topnav a { flex:1; text-align:center; text-decoration:none; padding:10px 8px; border-radius:10px; border:1px solid #d3d1c7; background:#fff; color:#2c2c2a; font-size:14px; }
  .topnav a.current { background:#2c2c2a; color:white; border-color:#2c2c2a; }
</style>
</head>
<body>
<nav class="topnav"><a href="list.html">一覧表</a><a class="current" href="quiz.html">クイズ</a></nav>
<h1>不規則動詞 小テスト対策</h1>
<p class="subtitle">原形を見て過去形を答えよう</p>
<div id="app"></div>

<script>
const verbs = [
["is/are","ある","was/were"],["become","になる","became"],["begin","始まる","began"],
["break","壊す","broke"],["bring","持ってくる","brought"],["build","建てる","built"],
["buy","買う","bought"],["catch","つかまえる","caught"],["come","来る","came"],
["cut","切る","cut"],["do","する、行う","did"],["drink","飲む","drank"],
["eat","食べる","ate"],["feel","感じる","felt"],["find","見つける","found"],
["forget","忘れる","forgot"],["get","手に入れる","got"],["give","与える","gave"],
["go","行く","went"],["grow","成長する","grew"],["have","持っている","had"],
["hear","聞こえる","heard"],["hold","持ちこたえる","held"],["keep","続ける","kept"],
["know","知る","knew"],["leave","去る","left"],["make","作る","made"],
["mean","意味する","meant"],["meet","会う","met"],["put","置く","put"],
["read","読む","read"],["run","走る","ran"],["say","言う","said"],
["see","見る","saw"],["sell","売る","sold"],["send","送る","sent"],
["sing","歌う","sang"],["sit","座る","sat"],["sleep","眠る","slept"],
["speak","話す","spoke"],["stand","立つ","stood"],["swim","泳ぐ","swam"],
["take","取る","took"],["teach","教える","taught"],["tell","伝える","told"],
["think","考える","thought"],["understand","理解する","understood"],
["wear","着る","wore"],["write","書く","wrote"]
];

let queue = [], idx = 0, correct = 0, wrong = [], total = 0, mode = 'setup';

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function speak(text){
  if(!window.speechSynthesis) { alert('お使いの環境では音声読み上げに対応していません'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace('/', ' or '));
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function startQuiz(n){
  queue = shuffle([...verbs]).slice(0, n);
  total = queue.length; idx = 0; correct = 0; wrong = [];
  mode = 'quiz';
  render();
}

function render(){
  const app = document.getElementById('app');
  if(mode === 'setup'){
    app.innerHTML = `
      <div class="setup-buttons">
        <button onclick="startQuiz(10)">10問（お試し）</button>
        <button onclick="startQuiz(25)">25問</button>
        <button onclick="startQuiz(49)">全49問</button>
      </div>`;
    return;
  }
  if(mode === 'quiz'){
    const [base, jp, past] = queue[idx];
    app.innerHTML = `
      <div class="progress"><span>${idx+1} / ${total}</span><span>正解 ${correct}</span></div>
      <div class="card">
        <p style="font-size:13px; color:#5f5e5a; margin:0 0 4px;">${jp}</p>
        <div class="row-flex">
          <p style="font-size:26px; font-weight:600; margin:0;">${base}</p>
          <button class="icon-btn" onclick="speak('${base.split('/')[0]}')" aria-label="発音を聞く">🔊</button>
        </div>
      </div>
      <input type="text" id="ans" placeholder="過去形を入力" autocomplete="off" />
      <p class="err" id="err"></p>
      <button class="primary-btn" onclick="checkAnswer()">答える</button>
    `;
    const inp = document.getElementById('ans');
    inp.focus();
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') checkAnswer(); });
    return;
  }
  if(mode === 'feedback'){
    const [base, jp, past] = queue[idx];
    const wasRight = app.dataset.right === '1';
    app.innerHTML = `
      <div class="card">
        <p style="font-size:13px; color:#5f5e5a; margin:0 0 4px;">${jp}</p>
        <div class="row-flex" style="margin-bottom:8px;">
          <p style="font-size:20px; margin:0;">${base} → <span style="font-weight:600;" class="${wasRight ? 'correct-text' : 'wrong-text'}">${past}</span></p>
          <button class="icon-btn" onclick="speak('${past.split('/')[0]}')" aria-label="発音を聞く">🔊</button>
        </div>
        <p style="font-size:14px; margin:0;" class="${wasRight ? 'correct-text' : 'wrong-text'}">${wasRight ? '正解！' : 'ちがうよ、もう一度書いて覚えよう'}</p>
      </div>
      <button class="primary-btn" onclick="nextQuestion()">${idx+1 < total ? '次の問題' : '結果を見る'}</button>
    `;
    return;
  }
  if(mode === 'result'){
    const pct = Math.round((correct/total)*100);
    app.innerHTML = `
      <p class="result-num">${correct} / ${total}</p>
      <p class="result-pct">正答率 ${pct}%</p>
      ${wrong.length ? `
      <div class="wrong-box">
        <p style="font-size:13px; color:#5f5e5a; margin:0 0 8px;">まちがえた単語（もう一度確認しよう）</p>
        ${wrong.map(w => `<p>${w[0]} → <b>${w[2]}</b>（${w[1]}）</p>`).join('')}
      </div>` : `<p class="correct-text" style="text-align:center; margin-bottom:16px;">全問正解！すごい！</p>`}
      <div class="btn-row">
        ${wrong.length ? `<button onclick="retryWrong()">まちがえた問題をやり直す</button>` : ''}
        <button onclick="mode='setup'; render();">はじめに戻る</button>
      </div>`;
    return;
  }
}

function checkAnswer(){
  const inp = document.getElementById('ans');
  const val = inp.value.trim();
  if(!val){
    document.getElementById('err').textContent = '答えを入力してね';
    return;
  }
  const [base, jp, past] = queue[idx];
  const rightAnswers = past.split('/').map(s => s.trim().toLowerCase());
  const isRight = rightAnswers.includes(val.toLowerCase());
  if(isRight){ correct++; } else { wrong.push(queue[idx]); }
  mode = 'feedback';
  document.getElementById('app').dataset.right = isRight ? '1' : '0';
  render();
}

function nextQuestion(){
  idx++;
  if(idx >= total){ mode = 'result'; }
  else { mode = 'quiz'; }
  render();
}

function retryWrong(){
  queue = shuffle([...wrong]);
  total = queue.length; idx = 0; correct = 0; wrong = [];
  mode = 'quiz';
  render();
}

render();
</script>
</body>
</html>
